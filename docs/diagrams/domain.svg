<svg xmlns="http://www.w3.org/2000/svg" width="940" height="604" viewBox="0 0 940 604"><title>Публичная модель расчёта одного месяца</title><desc>Калькулятор принимает MonthPlan и возвращает MonthReport. Пунктирные стрелки обозначают зависимости.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1 1 L10 5 L1 9" fill="none" stroke="#245746" stroke-width="1.5"/></marker></defs><rect width="940" height="604" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" fill="#20332e" font-size="17"><rect x="90" y="20" width="760" height="76" rx="3" fill="#fff" stroke="#245746"/><rect x="90" y="20" width="760" height="40" fill="#e8f0ec"/><path d="M90,60 h760" stroke="#245746"/><text x="470.0" y="46" text-anchor="middle" font-weight="bold">MonthCalculator</text><text x="104" y="85" font-size="14">+ Calculate(plan, openingCash, openingReceivables) : MonthReport</text><path d="M320.00 96.00 L315.52 101.38 M312.32 105.22 L307.84 110.60 M304.64 114.44 L300.15 119.81 M296.95 123.66 L292.47 129.03 M289.27 132.87 L284.79 138.25 M281.59 142.09 L277.11 147.47 M273.91 151.31 L269.43 156.69 M266.22 160.53 L261.74 165.91 M258.54 169.75 L254.06 175.13 M250.86 178.97 L246.38 184.35 M243.18 188.19 L238.70 193.56 M245.88 192.75 L235 198 M238.20 186.35 L235 198" fill="none" stroke="#245746" stroke-width="1.3"/><path d="M620.00 96.00 L624.48 101.38 M627.68 105.22 L632.16 110.60 M635.36 114.44 L639.85 119.81 M643.05 123.66 L647.53 129.03 M650.73 132.87 L655.21 138.25 M658.41 142.09 L662.89 147.47 M666.09 151.31 L670.57 156.69 M673.78 160.53 L678.26 165.91 M681.46 169.75 L685.94 175.13 M689.14 178.97 L693.62 184.35 M696.82 188.19 L701.30 193.56 M701.80 186.35 L705 198 M694.12 192.75 L705 198" fill="none" stroke="#245746" stroke-width="1.3"/><text x="184" y="147" font-size="14">принимает</text><text x="714" y="147" font-size="14">возвращает</text><rect x="20" y="200" width="410" height="172" rx="3" fill="#fff" stroke="#245746"/><rect x="20" y="200" width="410" height="40" fill="#e8f0ec"/><path d="M20,240 h410" stroke="#245746"/><text x="225.0" y="226" text-anchor="middle" font-weight="bold">MonthPlan</text><text x="34" y="265" font-size="14">+ Quantity : int</text><text x="34" y="289" font-size="14">+ Price : decimal</text><text x="34" y="313" font-size="14">+ UnitCost : decimal</text><text x="34" y="337" font-size="14">+ FixedCosts : decimal</text><text x="34" y="361" font-size="14">+ PaidNowPercent : int</text><rect x="470" y="200" width="450" height="292" rx="3" fill="#fff" stroke="#245746"/><rect x="470" y="200" width="450" height="40" fill="#e8f0ec"/><path d="M470,240 h450" stroke="#245746"/><text x="695.0" y="226" text-anchor="middle" font-weight="bold">MonthReport</text><text x="484" y="265" font-size="14">+ Revenue : decimal</text><text x="484" y="289" font-size="14">+ VariableCosts : decimal</text><text x="484" y="313" font-size="14">+ FixedCosts : decimal</text><text x="484" y="337" font-size="14">+ Margin : decimal</text><text x="484" y="361" font-size="14">+ CashReceipts : decimal</text><text x="484" y="385" font-size="14">+ ClosingCash : decimal</text><text x="484" y="409" font-size="14">+ ClosingReceivables : decimal</text><text x="484" y="433" font-size="14">+ /Expenses : decimal</text><text x="484" y="457" font-size="14">+ /Profit : decimal</text><text x="484" y="481" font-size="14">+ /FundingGap : decimal</text><text x="20" y="552" font-size="14">/ — вычисляемое свойство. Пунктир — зависимость.</text><text x="20" y="578" font-size="14">Внутренний Money проверяет денежные входы; в публичную модель не входит.</text></g></svg>